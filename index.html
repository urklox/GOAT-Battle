<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOAT Battle | Football Legends</title>
<style>
:root{--bg:#080b12;--panel:#121927;--gold:#f5c451;--muted:#9ca8ba}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#17263b,#080b12 65%);color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:38px 15px 25px}
.logo{color:var(--gold);font-size:12px;letter-spacing:5px;font-weight:bold}
h1{font-size:clamp(36px,8vw,66px);margin:12px 0}
h1 span{color:var(--gold)}
header p{color:var(--muted)}
.wrap{max-width:1000px;margin:auto;padding:15px}
.status{text-align:center;color:var(--muted);font-size:13px;margin:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:15px}
.card{background:linear-gradient(145deg,#172131,#0e1420);border:1px solid #29364a;border-radius:18px;padding:19px}
.top{display:flex;align-items:center;gap:13px}
.number{font-size:12px;color:var(--gold)}
.avatar{width:76px;height:76px;flex-shrink:0;border-radius:14px;background:#28364a;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.name{font-size:17px;font-weight:700;line-height:1.3}
.votes{color:var(--muted);font-size:13px;margin-top:6px}
.bar{height:7px;background:#273143;border-radius:10px;margin:18px 0 12px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#b88922,#ffdf78);transition:width .4s}
.bottom{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);gap:8px}
button{background:var(--gold);color:#111;border:0;border-radius:10px;padding:11px 17px;font-weight:800;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid #29364a;border-radius:18px;padding:20px;margin:22px 0}
.panel h2{margin-top:0}
.rankrow{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #29364a}
.rankrow:last-child{border:0}
.rank{color:var(--gold);font-weight:bold;width:27px}
.rankname{flex:1}
.rankvotes{color:var(--muted);font-size:13px}
footer{text-align:center;color:var(--muted);padding:30px;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="logo">THE ULTIMATE FOOTBALL POLL</div>
  <h1>GOAT <span>BATTLE</span></h1>
  <p>10 Legends. One Vote. Who is your Greatest of All Time?</p>
</header>
<main class="wrap">
  <div class="status" id="status">Connecting to voting database…</div>
  <section class="grid" id="players"></section>
  <section class="panel">
    <h2>🏆 Live Leaderboard</h2>
    <div id="leaderboard">Waiting for votes…</div>
  </section>
  <footer>GOAT BATTLE · Fan voting, not an official award</footer>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCLASTU-JFJotHJzlfeYdI7R3WBtgnoLwE",
  authDomain: "goat-battle-c7eb1.firebaseapp.com",
  projectId: "goat-battle-c7eb1",
  appId: "1:40867244998:web:a8a60a64cc0324d00ba0c7"
};

const legends = [
  ["platini","Michel Platini","🇫🇷"],
  ["di-stefano","Alfredo Di Stéfano","⭐"],
  ["beckenbauer","Franz Beckenbauer","🇩🇪"],
  ["ronaldo-nazario","Ronaldo Nazário","🇧🇷"],
  ["zidane","Zinedine Zidane","🇫🇷"],
  ["cruyff","Johan Cruyff","🇳🇱"],
  ["cristiano-ronaldo","Cristiano Ronaldo","🇵🇹"],
  ["maradona","Diego Maradona","🇦🇷"],
  ["pele","Pelé","🇧🇷"],
  ["messi","Lionel Messi","🇦🇷"]
];

const playerBox = document.getElementById("players");
const statusBox = document.getElementById("status");
const board = document.getElementById("leaderboard");
let db, currentUid = null, myVote = null, voteCounts = {};
let connected = false;

function renderPlayers() {
  playerBox.innerHTML = "";
  legends.forEach(([id,name,flag],i) => {
    const count = voteCounts[id] || 0;
    const total = Object.values(voteCounts).reduce((a,b)=>a+b,0);
    const percent = total ? (count/total*100) : 0;
    const card = document.createElement("article");
    card.className = "card";
    const top = document.createElement("div");
    top.className = "top";
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    const photo = document.createElement("img");
    const extension = (id === "ronaldo-nazario" || id === "pele") ? "webp" : "jpg";
    photo.src = "images/" + id + "." + extension;
    photo.alt = name;
    photo.loading = "lazy";
    photo.onerror = () => {
      avatar.textContent = flag;
      avatar.style.display = "grid";
      avatar.style.placeItems = "center";
      avatar.style.fontSize = "23px";
    };
    avatar.appendChild(photo);
    const info = document.createElement("div");
    const num = document.createElement("div");
    num.className = "number";
    num.textContent = "LEGEND " + String(i+1).padStart(2,"0");
    const title = document.createElement("div");
    title.className = "name";
    title.textContent = name;
    const votes = document.createElement("div");
    votes.className = "votes";
    votes.textContent = count + " votes";
    info.append(num,title,votes);
    top.append(avatar,info);
    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("div");
    fill.className = "fill";
    fill.style.width = percent + "%";
    bar.append(fill);
    const bottom = document.createElement("div");
    bottom.className = "bottom";
    const pct = document.createElement("span");
    pct.textContent = percent.toFixed(1) + "%";
    const btn = document.createElement("button");
    btn.textContent = myVote === id ? "Your vote ✓" : "VOTE";
    btn.disabled = !connected || !!myVote;
    btn.addEventListener("click",()=>castVote(id));
    bottom.append(pct,btn);
    card.append(top,bar,bottom);
    playerBox.append(card);
  });
  renderBoard();
}

function renderBoard() {
  const total = Object.values(voteCounts).reduce((a,b)=>a+b,0);
  const sorted = [...legends].sort((a,b)=>
    (voteCounts[b[0]]||0)-(voteCounts[a[0]]||0));
  board.innerHTML = "";
  sorted.forEach(([id,name,flag],i)=>{
    const row = document.createElement("div");
    row.className = "rankrow";
    const rank = document.createElement("span");
    rank.className = "rank";
    rank.textContent = "#" + (i+1);
    const n = document.createElement("span");
    n.className = "rankname";
    n.textContent = flag + " " + name;
    const v = document.createElement("span");
    v.className = "rankvotes";
    v.textContent = (voteCounts[id]||0) + " · " +
      (total ? ((voteCounts[id]||0)/total*100).toFixed(1) : "0.0") + "%";
    row.append(rank,n,v);
    board.append(row);
  });
}

function castVote(playerId) {
  if (!connected || !currentUid || myVote) return;
  statusBox.textContent = "Submitting your vote…";
  db.collection("votes").doc(currentUid).set({
    playerId,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    myVote = playerId;
    statusBox.textContent = "Vote saved! Thanks for participating.";
    renderPlayers();
  }).catch(err=>{
    statusBox.textContent = "Vote failed: " + err.message;
  });
}

function start() {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebase.auth().signInAnonymously().catch(err=>{
    statusBox.textContent = "Sign-in error. Check Firebase Anonymous Authentication.";
  });

  firebase.auth().onAuthStateChanged(user=>{
    if(!user) return;
    currentUid = user.uid;
    db.collection("votes").doc(currentUid).get().then(doc=>{
      if(doc.exists) myVote = doc.data().playerId;
      connected = true;
      statusBox.textContent = myVote
        ? "Your vote is saved · Live results"
        : "Choose your GOAT · One vote per signed-in browser";
      renderPlayers();
    }).catch(()=>{
      statusBox.textContent = "Could not load your vote. Check Firestore rules.";
    });
  });

  db.collection("votes").onSnapshot(snapshot=>{
    voteCounts = {};
    snapshot.forEach(doc=>{
      const id = doc.data().playerId;
      if(legends.some(p=>p[0]===id))
        voteCounts[id] = (voteCounts[id]||0)+1;
    });
    renderPlayers();
  },err=>{
    statusBox.textContent = "Could not load live results. Check Firestore rules.";
  });
}

const configured = firebaseConfig.apiKey !== "YOUR_API_KEY"
  && firebaseConfig.projectId !== "YOUR_PROJECT_ID"
  && firebaseConfig.appId !== "YOUR_APP_ID";

if(configured) {
  start();
} else {
  statusBox.textContent = "Preview mode · Connect Firebase to enable shared voting";
  connected = true;
  renderPlayers();
  playerBox.querySelectorAll("button").forEach(btn=>{
    btn.disabled = true;
    btn.textContent = "SET UP FIREBASE";
  });
}
</script>
</body>
</html>
